<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg bg-warning  ">

    <div class="container ">
        <div class="border rounded shadow border-success w-75 vh-100 mx-auto bg-light  m-4">
            <h1 class="text-center p-2 border  bg-primary text-warning  m-2 border-0 shadow">Registration form</h1>
            <div class=" m-2">
                <div class=" p-2">
                    <label for="">Fullname </label>
                    <input type="text" id="fullname" class="form-control" placeholder="enter your full name ">


                </div>
                <div class="p-2">
                    <label for="">Email</label>
                    <input type="text" id="email" class="form-control" placeholder="enter your email">
                </div>
                <div class="p-2">
                    <label for="">Phone number</label>
                    <input type="text" id="phone " class="form-control" placeholder="enter your phone numer">
                </div>

                <div class="p-2">
                    <label for="date">DOB</label>
                    <input type="date" id="dob" class="form-control" placeholder=" enter your DOB">
                    <span>Male</span>
                    <input type="radio">
                    <span>female</span>
                    <input type="radio">
                    <span>other</span>
                    <input type="radio">
                    
                </div>

                <div class="p-2">
                    <label for="qualification" class="form-label">
                     Qualification
                    </label>

                    <select class="form-select" id="qualification" required>
                        <option value="">Select Qualification</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                        <option value="graduate">Graduate</option>
                        <option value="postgraduate">Postgraduate</option>
                    </select>
                </div>

                <div class="p-2 " >
                
                    <label for="" class="form-label" >Batch timing</label>
                    <br>
                    <span>Morning</span>
                    <input type="checkbox">
                    <span>Evening</span>
                    <input type="checkbox">
                    <span>weekend</span>
                    <input type="checkbox">
                </div>





























            </div>


























        </div>




    </div>











    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
