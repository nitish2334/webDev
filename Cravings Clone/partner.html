<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravings - Partner Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        .partner-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #f97316 0%, #ff8c3a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .partner-form-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .partner-form-card h2 {
            color: #f97316;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .form-control, .form-select {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.25);
        }
        .btn-partner {
            background-color: #f97316;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            color: white;
        }
        .btn-partner:hover {
            background-color: #e55c00;
            color: white;
        }
    </style>
</head>

<body>
    <div id="navbar" class="d-flex justify-content-between align-items-center position-sticky top-0 z-2 shadow-m5"
        style="background-color: #f97316; height: 64px;">
        <span><img src="./image1.png" class="w-25 ms-3 ms-5" alt="" style="height: 40px;"></span>
        <span>
            <a href="index.html" class="btn border-light me-5 ms-2 text-light text-decoration-none">Back</a>
        </span>
    </div>

    <div class="partner-container">
        <div class="partner-form-card">
            <h2>Become a Restaurant Partner</h2>
            <p class="text-center text-muted mb-4">Grow your business with Cravings</p>

            <form id="partnerForm">
                <div>
                    <label for="restaurant_name" class="form-label fw-semibold">Restaurant Name</label>
                    <input type="text" id="restaurant_name" class="form-control" placeholder="Enter your restaurant name" required>
                </div>

                <div>
                    <label for="owner_name" class="form-label fw-semibold">Owner Name</label>
                    <input type="text" id="owner_name" class="form-control" placeholder="Enter owner name" required>
                </div>

                <div>
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>

                <div>
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter phone number" required>
                </div>

                <div>
                    <label for="address" class="form-label fw-semibold">Restaurant Address</label>
                    <textarea id="address" class="form-control" rows="3" placeholder="Enter full address" required></textarea>
                </div>

                <div>
                    <label for="cuisine" class="form-label fw-semibold">Cuisine Type</label>
                    <select id="cuisine" class="form-select" required>
                        <option value="">Select cuisine type</option>
                        <option value="Indian">Indian</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Italian">Italian</option>
                        <option value="Continental">Continental</option>
                        <option value="Fast Food">Fast Food</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <input type="checkbox" id="terms" required> 
                    <label for="terms" style="font-size: 13px; color: #666;">I agree to <a href="#" style="color: #f97316; text-decoration: none;">partner terms</a></label>
                </div>

                <button type="submit" class="btn btn-partner">Submit Application</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <p style="font-size: 14px; color: #666;">Already a partner? <a href="login.html" style="color: #f97316; font-weight: bold; text-decoration: none;">Login here</a></p>
            </div>
        </div>
    </div>

    <footer class="footer pt-5 bg-dark">
        <div class="container text-center text-md-start">
            <p class="text-center text-white small mb-5 fs-5">
                --- Your favorite food delivery platform connecting customers with restaurants and riders. ---
            </p>
            <div class="row align-items-start">
                <div class="col-md-2 mb-4">
                    <h6 class="fw-bold text-white">Quick Links</h6>
                    <a href="./index.html" style="color: #ccc; text-decoration: none;">Home</a><br>
                    <a href="about.html" style="color: #ccc; text-decoration: none;">About</a>
                </div>
                <div class="col-md-2 mb-4">
                    <h6 class="fw-bold text-white">Support</h6>
                    <a href="help.html" style="color: #ccc; text-decoration: none;">Help</a><br>
                    <a href="#" style="color: #ccc; text-decoration: none;">Contact</a>
                </div>
            </div>
            <hr class="bg-white">
            <div class="d-flex justify-content-center small text-white">
                <p>© 2026 Cravings. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('partnerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Partner application submitted! We will contact you soon.');
        });
    </script>
</body>

</html>
