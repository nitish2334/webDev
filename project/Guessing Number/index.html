<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

<div class="main ">
 
  <div class="card  border shadow  rounded-3 p-3">
     <h2>Guess The Number Task</h2>
            <p>We have selected a random number between 1 - 10. See if you can guess it.</p>

            <div class="controls">
                <label for="guess">Enter your guess (1-10):</label>
                <input id="guess" type="number" min="1" max="10" placeholder="Type a number" />
                <button id="submitBtn" type="button">Submit</button>
            </div>

            <p id="message" class="message" aria-live="polite"></p>


  </div>

</div>
    






    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
</body>
</html>
